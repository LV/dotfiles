after-startup-command = []

start-at-login = true

default-root-container-layout = 'tiles'

[key-mapping]
    preset = 'qwerty'

[mode.main.binding]
    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # alt-control-t = 'exec-and-forget /usr/bin/osascript -l AppleScript ~/.config/aerospace/scripts/ghostty-new-window.applescript'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'
    alt-a = 'workspace 🤖' # ai
    alt-b = 'workspace 🌐' # browser
    alt-m = 'workspace 💬' # messages
    alt-p = 'workspace ☁️' # parallels
    alt-t = 'workspace >_' # terminal
    alt-z = 'workspace 📞' # zoom

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'
    alt-shift-a = 'move-node-to-workspace 🤖'
    alt-shift-b = 'move-node-to-workspace 🌐'
    alt-shift-m = 'move-node-to-workspace 💬'
    alt-shift-p = 'move-node-to-workspace ☁️'
    alt-shift-t = 'move-node-to-workspace >_'
    alt-shift-z = 'move-node-to-workspace 📞'


[[on-window-detected]]
if.app-id = 'com.anthropic.claudefordesktop'
run = 'move-node-to-workspace 🤖'

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 🌐'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefoxdeveloperedition'
run = 'move-node-to-workspace 🌐'

[[on-window-detected]]
if.app-id = 'com.parallels.desktop.console'
run = 'move-node-to-workspace ☁️'

[[on-window-detected]]
if.app-id = 'com.automattic.beeper.desktop'
run = 'move-node-to-workspace 💬'

[[on-window-detected]]
if.app-id = 'org.mozilla.thunderbird'
run = 'move-node-to-workspace 💬'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace >_'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace 📞'
